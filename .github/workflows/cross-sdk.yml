# Cross-SDK conformance tests.
#
# Runs the 347-scenario cross-SDK suite for every SDK wrapper, one independent
# matrix job per SDK, on every PR (and on demand). Each job checks out this repo
# plus the SDK source repo(s) the wrapper builds from (all absmartly/* repos are
# public, so the default GITHUB_TOKEN suffices), builds just that wrapper +
# the orchestrator, and drives the suite through the orchestrator container
# (race-free service discovery over the compose network).
#
# SDK unit tests run in each SDK's own repo CI. The fast `harness` job below
# runs the orchestrator's own Docker-free unit tests (tests/ and
# orchestrator/tests/) before any wrapper image is built; every Docker job
# depends on it.
# The live-backend e2e suite is intentionally not run here (needs secrets +
# the abs CLI and mutates real experiments).
name: Cross-SDK Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cross-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness-unit-tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - name: Define SDK lanes
        id: lanes
        run: |
          matrix='{"include":[
            {"sdk":"javascript","repos":"javascript-sdk"},
            {"sdk":"python","repos":"python3-sdk"},
            {"sdk":"ruby","repos":"ruby-sdk"},
            {"sdk":"php","repos":"php-sdk"},
            {"sdk":"java","repos":"java-sdk"},
            {"sdk":"java-v1","repos":"java-sdk-v1"},
            {"sdk":"kotlin","repos":"kotlin-sdk"},
            {"sdk":"scala","repos":"scala-sdk"},
            {"sdk":"go","repos":"go-sdk"},
            {"sdk":"rust","repos":"rust-sdk"},
            {"sdk":"swift","repos":"swift-sdk"},
            {"sdk":"swift-v1","repos":"swift-sdk-v1"},
            {"sdk":"dotnet","repos":"dotnet-sdk"},
            {"sdk":"cpp","repos":"cpp-sdk"},
            {"sdk":"elixir","repos":"elixir-sdk"},
            {"sdk":"dart","repos":"flutter-sdk"},
            {"sdk":"flutter","repos":"flutter-sdk"},
            {"sdk":"liquid","repos":"liquid-sdk ruby-sdk"},
            {"sdk":"react","repos":"react-sdk javascript-sdk"},
            {"sdk":"vue2","repos":"vue2-sdk javascript-sdk"},
            {"sdk":"vue3","repos":"vue3-sdk javascript-sdk"},
            {"sdk":"angular","repos":"angular-sdk javascript-sdk"}
          ]}'
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Checkout cross-sdk-tests
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness test requirements
        # requirements-test.txt = requirements.txt + brotli (the br tests import
        # it at module level, so without it they fail, never skip).
        run: pip install -r orchestrator/requirements-test.txt

      - name: Byte-compile harness
        run: python -m py_compile orchestrator/test_runner.py orchestrator/results_aggregator.py orchestrator/e2e_runner.py orchestrator/local_collector_gate.py local-collector/local_collector.py context-server/server.py context-server/negotiation.py generate_context_compression_scenarios.py

      - name: Shell syntax
        run: for f in run-tests.sh run-all-tests.sh run-e2e-tests.sh run-local-collector-tests.sh; do bash -n "$f"; done

      - name: Harness unit tests (no Docker)
        run: python -m unittest discover -s tests -v

      - name: "Orchestrator unit tests: scenario groups and switchback harness (no Docker)"
        run: |
          pip install pytest
          python -m pytest orchestrator/tests -v

      - name: Switchback scenarios match their generator
        run: python generate_switchback_scenarios.py --check

      - name: Context-fetch compression scenarios match their generator
        run: python generate_context_compression_scenarios.py --check

      # The Holdout Conformance group is recorded from the javascript-sdk reference, built from
      # the commit the SDK-round generator pins (PINNED_COMMIT), next to this repo as SDK_PATH.
      - name: Read the javascript-sdk reference pin
        id: js-pin
        run: echo "commit=$(python -c 'import generate_sdk_round_2026_11_scenarios as g; print(g.PINNED_COMMIT)')" >> "$GITHUB_OUTPUT"

      - name: Checkout the javascript-sdk reference
        uses: actions/checkout@v4
        with:
          repository: absmartly/javascript-sdk
          ref: ${{ steps.js-pin.outputs.commit }}
          path: reference/javascript-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Holdout Conformance scenarios match the javascript-sdk reference
        run: SDK_PATH="$PWD/reference/javascript-sdk" python generate_holdout_conformance_scenarios.py --check

  cross-sdk:
    name: ${{ matrix.sdk }}
    needs: harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.harness.outputs.matrix) }}
    steps:
      # The wrapper Dockerfiles use build context `..` and COPY sibling
      # <name>-sdk/ directories, so this repo and the SDK source repos must be
      # checked out side by side. Put this repo under cross-sdk-tests/.
      - name: Checkout cross-sdk-tests
        uses: actions/checkout@v4
        with:
          path: cross-sdk-tests

      - name: Checkout SDK source repos
        run: |
          # Per-SDK known-good branches, single source of truth in
          # cross-sdk-tests/sdk-branches.sh (also used by local runs via
          # setup-sdks.sh) so CI builds the same branches that pass locally
          # instead of SDK main, which has API drift vs the wrappers.
          # Repos not listed fall back to main. SDK_REPO_SOURCES maps a checkout
          # directory to a different repo (java-sdk-v1 and swift-sdk-v1 clone absmartly/java-sdk
          # and absmartly/swift-sdk).
          source cross-sdk-tests/sdk-branches.sh
          source cross-sdk-tests/sdk-checkout.sh
          for repo in ${{ matrix.repos }}; do
            branch="${SDK_BRANCHES[$repo]:-main}"
            revision="${SDK_REVISIONS[$repo]:-}"
            source_repo="${SDK_REPO_SOURCES[$repo]:-$repo}"
            echo "::group::Cloning absmartly/$source_repo into $repo ($branch${revision:+ @ $revision})"
            if [ -n "$revision" ]; then
              git init -q "$repo"
              fetch_and_checkout_revision "$repo" "https://github.com/absmartly/$source_repo.git" "$revision"
            else
              git clone --depth 1 --branch "$branch" \
                "https://github.com/absmartly/$source_repo.git" "$repo"
            fi
            echo "::endgroup::"
          done

      - name: Build wrapper + orchestrator
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk
        run: docker compose build ${{ matrix.sdk }}-sdk context-server orchestrator

      - name: Run cross-SDK suite
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk
        run: |
          set -euo pipefail
          mkdir -p test-results
          rm -f test-results/report.json
          # context-server: the negotiating GET /context server the SDK fetches
          # from in the Context Fetch Compression scenarios (270-274: gzip 270-272,
          # br 273-274).
          docker compose up -d --force-recreate context-server ${{ matrix.sdk }}-sdk
          docker compose run --rm --no-deps \
            -e "SDK_SERVICES=${{ matrix.sdk }}" \
            orchestrator python3 test_runner.py
          test -s test-results/report.json || { echo "::error::orchestrator wrote no report.json"; exit 1; }

      # Live HTTP regressions for the dotnet wrapper's input and report boundaries, against the
      # wrapper the suite just ran (orchestrator/tests/test_dotnet_wrapper_http.py).
      - name: Dotnet wrapper HTTP regressions
        if: matrix.sdk == 'dotnet'
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps \
            -v "$PWD/orchestrator/tests:/app/tests:ro" \
            -e "DOTNET_WRAPPER_URL=http://dotnet-sdk:3000" \
            orchestrator sh -c "pip install --quiet pytest && python -m pytest -q tests/test_dotnet_wrapper_http.py"

      - name: C++ wrapper payload HTTP regressions
        if: matrix.sdk == 'cpp'
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk
        run: |
          set -euo pipefail
          port="$(docker compose port cpp-sdk 3000 | sed 's/.*://')"
          CPP_WRAPPER_URL="http://127.0.0.1:${port}" python3 cpp-wrapper/test_payload_http.py -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.sdk }}
          path: cross-sdk-tests/test-results/report.json
          if-no-files-found: error

      - name: Tear down
        if: always()
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk
        run: docker compose down --remove-orphans --volumes || true

  # The matrix job above runs one SDK per job, so test_runner's cross-SDK
  # consistency check (which needs 2+ SDKs) never fires inside a lane. This job
  # collects every lane's report (each carries its per-scenario outcomes and
  # per-step observations: results, exposures, ready/refresh experiments and
  # publish payloads) and compares all SDKs against each other. It runs even
  # when some lanes failed, so a drift is reported alongside lane failures, and
  # its failure fails the workflow like any other required job.
  cross-sdk-consistency:
    name: cross-sdk-consistency
    needs: [harness, cross-sdk]
    if: ${{ always() && needs.cross-sdk.result != 'cancelled' && needs.cross-sdk.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cross-sdk-tests
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator requirements
        run: pip install -r orchestrator/requirements.txt

      - name: Download lane reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: lane-reports

      - name: Compare all lanes
        env:
          EXPECTED_SDKS: ${{ join(fromJSON(needs.harness.outputs.matrix).include.*.sdk, ',') }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find lane-reports -name report.json | sort)
          echo "lane reports: ${#reports[@]}"
          python orchestrator/test_runner.py --report consistency-report.json \
            --expected-sdks "$EXPECTED_SDKS" \
            --compare-reports "${reports[@]}"

      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-sdk-consistency
          path: consistency-report.json
          if-no-files-found: warn

  # Blocking local collector release gate. test-1 is intentionally not part of CI;
  # run-e2e-tests.sh remains optional smoke coverage for a real ABsmartly environment.
  local-collector-gate:
    name: local-collector-gate (${{ matrix.sdk }})
    needs: harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [javascript, python]
    steps:
      - name: Checkout cross-sdk-tests
        uses: actions/checkout@v4
        with:
          path: cross-sdk-tests

      - name: Checkout SDK source repos
        working-directory: cross-sdk-tests
        run: |
          source sdk-branches.sh
          source sdk-checkout.sh
          for repo in "${{ matrix.sdk }}"; do
            branch="${SDK_BRANCHES[$repo]:-main}"
            git clone --depth 1 --branch "$branch" "https://x-access-token:${{ github.token }}@github.com/absmartly/$repo.git" "$repo"
          done

      - name: Build local collector, wrapper and orchestrator
        working-directory: cross-sdk-tests
        run: docker compose -f docker-compose.yml -f docker-compose.local-collector.yml build local-collector ${{ matrix.sdk }}-sdk orchestrator

      - name: Run blocking local collector gate
        working-directory: cross-sdk-tests
        env:
          COMPOSE_PROJECT_NAME: csdk-local-gate
        run: ./run-local-collector-tests.sh --sdk "${{ matrix.sdk }}" --skip-build

      - name: Upload local collector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-collector-${{ matrix.sdk }}
          path: cross-sdk-tests/test-results/local-collector.json
          if-no-files-found: error

      - name: Tear down local collector gate
        if: always()
        working-directory: cross-sdk-tests
        run: docker compose -f docker-compose.yml -f docker-compose.local-collector.yml down --remove-orphans --volumes || true
