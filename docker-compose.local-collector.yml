# Points every SDK wrapper's e2e mode at the local collector instead of test-1.
# Used by run-local-collector-tests.sh (the blocking event-emission gate).
services:
  javascript-sdk:
    depends_on:
      - local-collector
    environment:
      - ABSMARTLY_E2E_ENDPOINT=http://local-collector:8090/v1
      - ABSMARTLY_E2E_API_KEY=local-collector
      - ABSMARTLY_E2E_APPLICATION=e2e-tests
      - ABSMARTLY_E2E_ENVIRONMENT=production
